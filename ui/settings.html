<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>text-snap 设置</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f7f8fa;
      --line: #e3e6ec;
      --text: #1b1f27;
      --muted: #6b7280;
      --accent: #1d4ed8;
      --accent-ink: #1741b6;
      --danger: #b42318;
      --ok-ink: #067647;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .label { font-weight: 500; }

    /* 两列网格：左列是说明文字（右对齐），右列是控件 —— 仿 Snipaste 的设置版式 */
    .grid {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 10px 12px;
      align-items: center;
    }

    .grid > .k {
      text-align: right;
      white-space: nowrap;
      color: var(--text);
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }

    .hint.bad { color: var(--danger); }
    .hint.ok { color: var(--ok-ink); }

    /* 快捷键录制框 */
    .hotkey {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px 12px;
      font: 13px/1 "Cascadia Mono", "Consolas", monospace;
      text-align: center;
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    .hotkey:focus,
    .hotkey.recording {
      border-color: var(--accent);
      background: #eef2ff;
      color: var(--accent-ink);
    }

    .hotkey.empty { color: var(--muted); font-style: italic; }

    .row { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: 12.5px/1.5 "Cascadia Mono", "Consolas", monospace;
      padding: 7px 10px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background: #f2f4f7; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover:not(:disabled) { background: var(--accent-ink); }

    .divider { height: 1px; background: var(--line); }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .check input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }

    footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--line);
    }

    footer .status {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    footer .status.bad { color: var(--danger); }
    footer .status.ok { color: var(--ok-ink); }

    .path-note { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <main>
    <div>
      <div class="label" style="margin-bottom: 8px;">快捷键</div>
      <div class="grid">
        <div class="k">读取选中文本:</div>
        <div class="hotkey" id="hk-read" tabindex="0" title="点这里，然后直接按你想用的组合键；Esc 取消"></div>

        <div class="k">最小化/还原编辑器:</div>
        <div class="hotkey" id="hk-min" tabindex="0" title="点这里，然后直接按你想用的组合键；Esc 取消"></div>
      </div>
      <div class="hint" id="hotkey-hint" style="margin-top: 8px;">
        点框后直接按组合键。至少一个修饰键（Ctrl / Shift / Alt / Win）。
        按 <b>Backspace</b> 清空第二项 = 不注册快捷键（仍可用托盘菜单）。
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label" style="margin-bottom: 8px;">保存</div>
      <div class="grid">
        <div class="k">保存目录:</div>
        <div class="row">
          <input type="text" id="dir" placeholder="留空 = 用「文档\text-snap」" spellcheck="false" />
          <button id="browse">浏览…</button>
          <button id="open">打开</button>
          <button id="reset">恢复默认</button>
        </div>
      </div>
      <div class="path-note" id="dir-note" style="margin-top: 6px;"></div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label" style="margin-bottom: 8px;">启动</div>
      <div class="grid">
        <div class="k">启动提示:</div>
        <label class="check">
          <input type="checkbox" id="toast" />
          <span>每次启动时发一条系统通知，提示程序已在后台运行</span>
        </label>
      </div>
    </div>
  </main>

  <footer>
    <span class="status" id="status"></span>
    <button class="primary" id="save">保存并应用</button>
  </footer>

  <script>
    (function () {
      const tauri = window.__TAURI__;
      const $ = (id) => document.getElementById(id);

      if (!tauri) {
        $('status').textContent = '没有检测到 Tauri 运行时';
        return;
      }
      const invoke = tauri.core.invoke;

      const MODIFIER_CODES = [
        'ControlLeft', 'ControlRight', 'ShiftLeft', 'ShiftRight',
        'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight',
      ];

      const NAMED_CODES = {
        Space: 'Space', Enter: 'Enter', Tab: 'Tab',
        Minus: 'Minus', Equal: 'Equal', Comma: 'Comma', Period: 'Period',
        Slash: 'Slash', Semicolon: 'Semicolon', Quote: 'Quote',
        Backquote: 'Backquote', BracketLeft: 'BracketLeft', BracketRight: 'BracketRight',
      };

      const DEFAULT_HINT =
        '点框后直接按组合键。至少一个修饰键（Ctrl / Shift / Alt / Win）。' +
        '按 Backspace 清空第二项 = 不注册快捷键（仍可用托盘菜单）。';

      let saved = null;        // 服务端当前配置
      let draftRead = null;    // null = 没改过
      let draftMin = null;
      const hintEl = $('hotkey-hint');

      // ── 把 JS 的物理键位码翻成后端认的按键名 ──────────────────
      function codeToName(code) {
        if (code.startsWith('Key')) return code.slice(3);          // KeyA -> A
        if (code.startsWith('Digit')) return code.slice(5);        // Digit1 -> 1
        if (/^F([1-9]|1[0-2])$/.test(code)) return code;           // F1..F12
        if (NAMED_CODES[code]) return NAMED_CODES[code];
        return null;                                               // 小键盘、媒体键等暂不支持
      }

      function setHint(text, kind) {
        hintEl.innerHTML = text || DEFAULT_HINT;
        hintEl.className = 'hint' + (kind ? ' ' + kind : '');
      }

      function setStatus(text, kind) {
        const el = $('status');
        el.textContent = text || '';
        el.className = 'status' + (kind ? ' ' + kind : '');
      }

      // ── 录制框：两个框共用同一套逻辑 ──────────────────────────
      // getValue 读当前值，setValue 写入草稿，paint 负责回显
      function createRecorder(el, getValue, setValue) {
        let recording = false;

        function paint() {
          const value = getValue();
          el.textContent = value || '未设置（点击后按键）';
          el.classList.toggle('empty', !value);
        }

        el.addEventListener('focus', function () {
          recording = true;
          el.classList.add('recording');
          el.classList.remove('empty');
          el.textContent = '按下组合键…';
          setHint('按 <b>Backspace</b> 清空这一项；<b>Esc</b> 取消录制。');
        });

        el.addEventListener('blur', function () {
          recording = false;
          el.classList.remove('recording');
          paint();
        });

        el.addEventListener('keydown', function (event) {
          if (!recording) return;
          event.preventDefault();

          if (event.code === 'Escape') { el.blur(); return; }

          // 清空 = 不注册（只有第二项有意义，第一项清空后端会报错拦住）
          if (event.code === 'Backspace' || event.code === 'Delete') {
            setValue('');
            el.blur();
            setHint('已清空，按「保存并应用」生效。');
            return;
          }

          const mods = [];
          if (event.ctrlKey) mods.push('Ctrl');
          if (event.shiftKey) mods.push('Shift');
          if (event.altKey) mods.push('Alt');
          if (event.metaKey) mods.push('Win');

          // 只按了修饰键：先显示出来，等主键
          if (MODIFIER_CODES.indexOf(event.code) !== -1) {
            el.textContent = mods.length ? mods.join('+') + '+…' : '按下组合键…';
            return;
          }

          const name = codeToName(event.code);
          if (!name) {
            setHint('这个键不支持做快捷键（小键盘、媒体键等暂不支持）', 'bad');
            return;
          }
          if (mods.length === 0) {
            setHint('至少要有一个修饰键：Ctrl / Shift / Alt / Win', 'bad');
            return;
          }

          setValue(mods.join('+') + '+' + name);
          el.blur();
          setHint('按「保存并应用」生效。再点一下可以重录。');
        });

        paint();
        return { paint: paint };
      }

      const readValue = () => (draftRead !== null ? draftRead : (saved ? saved.hotkey : ''));
      const minValue = () => (draftMin !== null ? draftMin : (saved ? saved.minimize_hotkey : ''));

      createRecorder($('hk-read'), readValue, (v) => { draftRead = v; });
      createRecorder($('hk-min'), minValue, (v) => { draftMin = v; });

      function renderDir(info) {
        const input = $('dir');
        if (document.activeElement !== input) {
          input.value = info.save_dir_raw || '';
        }
        input.placeholder = info.save_dir_custom
          ? '留空 = 用「文档\\text-snap」'
          : info.save_dir;

        const note = $('dir-note');
        if (!info.save_dir_custom) {
          note.textContent = '当前用默认目录：' + info.save_dir;
        } else if (info.save_dir_exists) {
          note.textContent = '当前目录：' + info.save_dir + '（已存在）';
        } else {
          note.textContent = '当前目录：' + info.save_dir + '（还不存在，首次保存时会自动创建）';
        }
      }

      function apply(info) {
        saved = info;
        draftRead = null;
        draftMin = null;
        $('hk-read').textContent = info.hotkey || '未设置（点击后按键）';
        $('hk-min').textContent = info.minimize_hotkey || '未设置（点击后按键）';
        $('hk-read').classList.toggle('empty', !info.hotkey);
        $('hk-min').classList.toggle('empty', !info.minimize_hotkey);
        $('toast').checked = !!info.show_startup_toast;
        renderDir(info);
      }

      // ── 目录相关 ───────────────────────────────────────────
      $('browse').addEventListener('click', async function () {
        try {
          const picked = await invoke('pick_folder');
          if (picked) {
            $('dir').value = picked;
            setStatus('已选中目录，别忘了点「保存并应用」', '');
          }
        } catch (err) {
          setStatus('打开文件夹选择框失败：' + err, 'bad');
        }
      });

      $('open').addEventListener('click', async function () {
        const value = $('dir').value.trim() || (saved ? saved.save_dir : '');
        if (!value) return;
        try {
          await invoke('open_dir', { path: value });
        } catch (err) {
          setStatus(String(err), 'bad');
        }
      });

      $('reset').addEventListener('click', function () {
        $('dir').value = '';
        setStatus('已清空，点「保存并应用」后回到默认目录', '');
      });

      // ── 保存 ───────────────────────────────────────────────
      $('save').addEventListener('click', async function () {
        $('save').disabled = true;
        setStatus('正在应用…', '');
        try {
          const info = await invoke('apply_settings', {
            hotkey: readValue(),
            minimizeHotkey: minValue(),
            saveDir: $('dir').value,
            showStartupToast: $('toast').checked,
          });
          apply(info);
          setStatus('已保存并生效', 'ok');
        } catch (err) {
          setStatus(String(err), 'bad');
        } finally {
          $('save').disabled = false;
        }
      });

      (async function boot() {
        try {
          apply(await invoke('ui_info'));
        } catch (err) {
          setStatus('读取当前配置失败：' + err, 'bad');
        }
      })();
    })();
  </script>
</body>

</html>
